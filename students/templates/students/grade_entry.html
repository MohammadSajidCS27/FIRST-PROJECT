{% extends 'base.html' %}
{% block content %}
<div class="card">
  <h2>Pending Grade Entry</h2>
  <form method="post">{% csrf_token %}
    <table>
      <thead>
        <tr><th>Student</th><th>Course</th><th>Semester</th><th>Grade</th></tr>
      </thead>
      <tbody>
      {% for e in pending %}
        <tr>
          <td>{{ e.student.roll_number }}</td>
          <td>{{ e.course.code }}</td>
          <td>{{ e.semester }}</td>
          <td>
            <select name="grade_{{ e.id }}">
              <option value="">--</option>
              {% for g in grade_choices %}
                <option value="{{ g }}">{{ g }}</option>
              {% endfor %}
            </select>
          </td>
        </tr>
      {% empty %}
        <tr><td colspan="4">No pending grades.</td></tr>
      {% endfor %}
      </tbody>
    </table>
    <button type="submit">Save Grades</button>
  </form>
</div>
{% endblock %}
