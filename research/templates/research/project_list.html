{% extends 'base.html' %}
{% block content %}
<div class="card">
  <h2>Research Projects</h2>
  <p><a href="/research/projects/add/">Add Project</a></p>
  <table>
    <thead><tr><th>Title</th><th>PI</th><th>Start</th><th>End</th></tr></thead>
    <tbody>
      {% for p in projects %}
      <tr><td>{{ p.title }}</td><td>{{ p.principal_investigator }}</td><td>{{ p.start_date }}</td><td>{{ p.end_date|default:'-' }}</td></tr>
      {% empty %}
      <tr><td colspan="4">No projects.</td></tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
