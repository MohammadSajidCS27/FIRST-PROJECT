{% extends 'base.html' %}
{% block content %}
<div class="card">
  <h2>Inventory</h2>
  <p><a href="/inventory/add/">Add Item</a></p>
  <table>
    <thead><tr><th>ID</th><th>Name</th><th>Category</th><th>Location</th><th>Qty</th></tr></thead>
    <tbody>
      {% for i in items %}
      <tr>
        <td>{{ i.identifier }}</td><td>{{ i.name }}</td><td>{{ i.category }}</td><td>{{ i.location }}</td><td>{{ i.quantity }}</td>
      </tr>
      {% empty %}
      <tr><td colspan="5">No items.</td></tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
